<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Terra Observation — River helper map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3yns/9c+vJKlZ3Z4S8p9H6h9kLxwo=" crossorigin="" />
  <style>
    html,body,#map{height:100%;margin:0;background:#f7fafc}body{font-family:Inter,system-ui,sans-serif;color:#172736}.leaflet-container{background:#f7fafc}.country-label{background:transparent;border:0;box-shadow:none;color:#243747;font-size:11px;font-weight:800;text-shadow:0 1px 0 #fff,1px 0 0 #fff,0 -1px 0 #fff,-1px 0 0 #fff;white-space:nowrap}.country-label:before{display:none}.target-label{background:#08324a;color:#fff;border:1px solid #45d7ff;border-radius:8px;padding:4px 7px;font-size:10px;font-weight:700;box-shadow:0 2px 12px rgba(0,0,0,.18)}.target-label:before{border-top-color:#08324a}.helper-status{position:absolute;z-index:900;left:10px;top:10px;max-width:min(390px,calc(100% - 70px));padding:8px 10px;border:1px solid #c8d8e4;border-radius:9px;background:rgba(255,255,255,.94);box-shadow:0 2px 14px rgba(22,48,70,.12);font-size:10px;line-height:1.45;color:#4c6171}.helper-status b{display:block;color:#17384b;font-size:11px}.helper-status.error{border-color:#d88;color:#842c2c}.leaflet-control-attribution{font-size:8px!important}
  </style>
</head>
<body>
  <div id="map" aria-label="River helper map showing countries and rivers"></div>
  <div id="status" class="helper-status"><b>River helper map</b>Country names + major rivers. Province and district borders are intentionally hidden.</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    (() => {
      const query = new URLSearchParams(location.search)
      const lat = Number(query.get('lat'))
      const lon = Number(query.get('lon'))
      const label = query.get('label') || 'Selected research area'
      const center = Number.isFinite(lat) && Number.isFinite(lon) ? [lat, lon] : [20, 10]
      const map = L.map('map', { zoomControl: true, preferCanvas: true }).setView(center, Number.isFinite(lat) ? 6 : 3)
      const status = document.getElementById('status')

      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
      }).addTo(map)

      if (Number.isFinite(lat) && Number.isFinite(lon)) {
        L.circleMarker(center, {
          radius: 6,
          color: '#073b56',
          weight: 2,
          fillColor: '#45d7ff',
          fillOpacity: 1
        }).addTo(map).bindTooltip(label, { permanent: false, direction: 'top', className: 'target-label' })
      }

      const sources = {
        countries: 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson',
        rivers: 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_rivers_lake_centerlines.geojson',
        lakes: 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_lakes.geojson'
      }

      const loadJson = async url => {
        const response = await fetch(url, { mode: 'cors' })
        if (!response.ok) throw new Error(`${response.status} ${url}`)
        return response.json()
      }

      Promise.all([loadJson(sources.countries), loadJson(sources.rivers), loadJson(sources.lakes)])
        .then(([countries, rivers, lakes]) => {
          const countryLayer = L.geoJSON(countries, {
            style: { color: '#9fb2bf', weight: .65, opacity: .8, fillColor: '#ffffff', fillOpacity: .06 },
            onEachFeature: (feature, layer) => {
              const name = feature?.properties?.ADMIN || feature?.properties?.NAME_EN || feature?.properties?.NAME
              if (!name || !layer.getBounds) return
              const marker = L.marker(layer.getBounds().getCenter(), {
                interactive: false,
                icon: L.divIcon({ className: 'country-label', html: String(name), iconSize: null })
              })
              marker.addTo(map)
            }
          }).addTo(map)

          L.geoJSON(lakes, {
            style: { color: '#56a9d6', weight: .7, fillColor: '#d8eff9', fillOpacity: .72 }
          }).addTo(map)

          L.geoJSON(rivers, {
            style: feature => {
              const scale = Number(feature?.properties?.scalerank ?? 7)
              const weight = scale <= 3 ? 2.2 : scale <= 6 ? 1.45 : .9
              return { color: '#168bc2', weight, opacity: .92 }
            }
          }).addTo(map)

          if (countryLayer && status) {
            status.innerHTML = '<b>River helper map</b>Natural Earth country names, country outlines, major lakes and river centerlines. No province/admin-1 borders or local-place label layer.'
          }
        })
        .catch(error => {
          console.error(error)
          if (status) {
            status.classList.add('error')
            status.innerHTML = '<b>Hydrology overlays unavailable</b>The clean base map is still available, but Natural Earth country/river layers could not be loaded. Retry when network access is restored.'
          }
        })
    })()
  </script>
</body>
</html>
