<!doctype html>
<html lang="pl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="description" content="Geospatial investigation support based on authentic Earth observation products."/><title>Investigation Support · Terraforming Planet</title><link rel="stylesheet" href="../multi-angle/styles.css"/></head><body><header class="topbar"><a href="../">← Terra Observation</a><nav><a href="../multi-angle/">Obserwacja wielokątowa</a><a class="active" href="./">Investigation Support</a></nav></header><main><section class="hero"><p class="eyebrow">GEOFORENSICS · CHANGE DETECTION</p><h1>Investigation Support</h1><p>Wpisz adres, wybierz obszar i dwa okresy. Współrzędne są opcjonalne i ukryte domyślnie.</p></section><section class="panel"><form id="case-form"><label>Rodzaj analizy<select id="case-type"><option>Porwanie lub trasa pojazdu — analiza obszaru</option><option>Kradzież lub zdarzenie — analiza zmian</option><option>Nielegalna wycinka</option><option>Nielegalne górnictwo</option><option>Pożar i miejsce początku</option><option>Szkody powodziowe</option><option>Inne zdarzenie</option></select></label><label class="address-field">Adres lub nazwa miejsca<input id="address" type="search" placeholder="np. ulica, miasto, kraj"/><button id="geocode" type="button" class="secondary">Znajdź adres</button></label><label class="coordinate-toggle"><input id="manual-coordinates" type="checkbox"/> Pokaż ręczne współrzędne</label><div id="coordinate-fields" class="coordinate-fields" hidden><label>Szerokość<input id="lat" type="number" step="0.0001" min="-90" max="90" value="52.2297"/></label><label>Długość<input id="lon" type="number" step="0.0001" min="-180" max="180" value="21.0122"/></label></div><label>Okres „przed” — od<input id="before-from" type="date" value="2024-03-01" required/></label><label>Okres „przed” — do<input id="before-to" type="date" value="2024-04-30" required/></label><label>Okres „po” — od<input id="after-from" type="date" value="2024-05-01" required/></label><label>Okres „po” — do<input id="after-to" type="date" value="2024-06-30" required/></label><label>Promień obszaru (km)<input id="radius" type="number" min="0.1" max="100" step="0.1" value="2" required/></label><label>Sensor<select id="collection"><option value="sentinel-2-l2a">Sentinel-2 optyczny</option><option value="sentinel-1-grd">Sentinel-1 radar SAR</option></select></label><button type="submit">Utwórz pakiet porównawczy</button></form></section><section class="status" id="status" aria-live="polite">Wpisz adres i dwa okresy.</section><section id="case-summary" class="summary"></section><section id="results" class="results"></section></main><script type="module" src="./app.js"></script></body></html>
