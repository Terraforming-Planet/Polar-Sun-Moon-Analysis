name: Night Agent Sahara globe and scaling repair

on:
  push:
    branches:
      - codex/night-agent-sahara-globe-01

permissions:
  contents: write

jobs:
  repair-sahara:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/night-agent-sahara-globe-01
          fetch-depth: 0

      - name: Apply Sahara repair script
        run: python scripts/night_agent_sahara_01.py

      - name: Validate Sahara runtime
        run: |
          python -m pytest tests/test_sahara_station_page.py -q
          node --check web/public/sahara-station/sahara-lab.js
          node --check web/public/sahara-station/sahara-globe.js
          cmp web/public/sahara-station/sahara-lab.js docs/sahara-station/sahara-lab.js
          cmp web/public/sahara-station/sahara-globe.js docs/sahara-station/sahara-globe.js
          cmp web/public/sahara-station/sahara-lab.css docs/sahara-station/sahara-lab.css

      - name: Commit repaired Sahara station
        shell: bash
        run: |
          rm -f .github/workflows/night-agent-sahara-01.yml scripts/night_agent_sahara_01.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/sahara-station docs/sahara-station tests/test_sahara_station_page.py .github/workflows/night-agent-sahara-01.yml scripts/night_agent_sahara_01.py
          git commit -m "fix: add NASA globe and repair Sahara shape controls"
          git push origin HEAD:codex/night-agent-sahara-globe-01
