name: Experiment 015 Himalaya-Tibet seasonal evidence

on:
  push:
    branches:
      - experiment-015-himalaya-tibet-v2-30-234961-83-056124
    paths:
      - 'tools/build_experiment_015_seasonal_evidence.py'
      - 'tools/publish_experiment_integrity.py'
      - '.github/workflows/experiment-015-seasonal-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-015-himalaya-tibet-v2-30-234961-83-056124
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools
            published
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow requests rasterio pyproj
      - name: Build Test 015 spring and autumn imagery 1990-2026
        run: python tools/build_experiment_015_seasonal_evidence.py
      - name: Validate Test 015 dates, frames and duplicate integrity
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import date
          from pathlib import Path
          from PIL import Image
          exp=Path('experiments/experiment_015_himalaya_tibet')
          s=json.loads((exp/'BUILD_SUMMARY.json').read_text())
          assert s['experiment']==15 and s['center']=={'lat':30.234961,'lon':83.056124}
          assert s['frame_width_m']==80000 and s['frame_height_m']==80000 and s['output_grid_m']==30.0
          assert s['spring_count_ok']>=30 and s['autumn_count_ok']>=30, s
          assert Path(s['combined_zip']).exists()
          seen_hash={}; seen_item={}
          for season in ('spring','autumn'):
              root=exp/'seasonal_evidence'/season
              m=json.loads((root/'manifest.json').read_text())
              assert len(m['records'])==37
              for r in m['records']:
                  if r.get('status')!='ok': continue
                  assert str(r['date']).startswith(str(r['year'])+'-')
                  p=root/'images'/r['files'][0]; assert p.exists()
                  h=hashlib.sha256(p.read_bytes()).hexdigest(); key=f"{season}:{r['year']}"
                  assert h not in seen_hash, f"exact duplicate {seen_hash[h]} == {key}"; seen_hash[h]=key
                  item=r.get('item_id')
                  if item: assert item not in seen_item, f"source product reused {seen_item[item]} == {key}"; seen_item[item]=key
                  with Image.open(p) as im: assert im.width>=2500 and im.height>=2500, (key, im.size)
          if date.today()<date(2026,9,1):
              am=json.loads((exp/'seasonal_evidence/autumn/manifest.json').read_text())
              assert next(x for x in am['records'] if x['year']==2026).get('status')!='ok'
          print('EXPERIMENT_015_VALIDATED')
          PY
      - name: Build lightweight integrity index and gallery
        run: python tools/publish_experiment_integrity.py --test 15 --experiment-dir experiments/experiment_015_himalaya_tibet --gallery
      - name: Upload Test 015 downloadable ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: TEST015_HIMALAYA_TIBET_1990_2026_SPRING_AUTUMN
          path: |
            experiments/experiment_015_himalaya_tibet/*.zip
            experiments/experiment_015_himalaya_tibet/seasonal_evidence/spring/*.zip
            experiments/experiment_015_himalaya_tibet/seasonal_evidence/autumn/*.zip
            experiments/experiment_015_himalaya_tibet/BUILD_SUMMARY.json
            experiments/experiment_015_himalaya_tibet/EXPERIMENT_015_REPORT.md
            experiments/experiment_015_himalaya_tibet/EVIDENCE_POLICY.json
            experiments/experiment_015_himalaya_tibet/seasonal_evidence/spring/manifest.json
            experiments/experiment_015_himalaya_tibet/seasonal_evidence/autumn/manifest.json
            experiments/experiment_015_himalaya_tibet/seasonal_evidence/spring/CONTACT_SHEET_SPRING_1990_2026.jpg
            experiments/experiment_015_himalaya_tibet/seasonal_evidence/autumn/CONTACT_SHEET_AUTUMN_1990_2026.jpg
          retention-days: 90
          compression-level: 0
      - name: Upload Test 015 lightweight integrity metadata
        uses: actions/upload-artifact@v4
        with:
          name: TEST015_INTEGRITY_INDEX_AND_GALLERY
          path: published/experiment-015
          retention-days: 90
      - name: Commit lightweight integrity metadata and gallery
        run: |
          git config user.name "terraforming-planet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add --sparse -f published/experiment-015
          if git diff --cached --quiet; then
            echo "No lightweight publication changes"
          else
            git commit -m "data(test015): publish integrity index and gallery"
            git push origin HEAD:experiment-015-himalaya-tibet-v2-30-234961-83-056124
          fi
