name: Experiment 015 Himalaya Tibet seasonal evidence
on:
  push:
    branches: [experiment-015-himalaya-tibet-30-234961-83-056124]
    paths: ['.github/workflows/experiment-015-seasonal-evidence.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-015-himalaya-tibet-30-234961-83-056124
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: tools
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow requests rasterio pyproj
      - name: Configure Test 015 from validated regional mosaic engine
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tools/build_experiment_012_seasonal_evidence.py').read_text()
          replacements={'TEST = 12':'TEST = 15','LAT = 41.150000':'LAT = 30.234961','LON = -112.600000':'LON = 83.056124','LAT_STR = "41.150000"':'LAT_STR = "30.234961"','LON_STR = "-112.600000"':'LON_STR = "83.056124"','experiment-012-great-salt-lake-41-150000--112-600000':'experiment-015-himalaya-tibet-30-234961-83-056124','experiment_012_great_salt_lake':'experiment_015_himalaya_tibet','FRAME_WIDTH_M = 120000.0':'FRAME_WIDTH_M = 80000.0','FRAME_HEIGHT_M = 160000.0':'FRAME_HEIGHT_M = 80000.0','FRAME_LABEL = "120x160km"':'FRAME_LABEL = "80x80km"','DISPLAY_WIDTH = 900':'DISPLAY_WIDTH = 1000','DISPLAY_HEIGHT = 1200':'DISPLAY_HEIGHT = 1000','TARGET_CRS = "EPSG:32612"':'TARGET_CRS = "EPSG:32644"','Test 012':'Test 015','TEST012':'TEST015','Experiment 012':'Experiment 015','Great Salt Lake Utah USA water-loss reference':'Himalaya Tibet seasonal snow water topography reference','Great Salt Lake':'Himalaya Tibet observation'}
          for a,b in replacements.items(): s=s.replace(a,b)
          Path('tools/build_experiment_015_seasonal_evidence.py').write_text(s)
          PY
      - name: Build Test 015 spring and autumn imagery 1990-2026
        run: python tools/build_experiment_015_seasonal_evidence.py
      - name: Validate Test 015 integrity
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          exp=Path('experiments/experiment_015_himalaya_tibet'); summary=json.loads((exp/'BUILD_SUMMARY.json').read_text())
          assert summary['experiment']==15; assert summary['center']=={'lat':30.234961,'lon':83.056124}; assert summary['frame_width_m']==80000 and summary['frame_height_m']==80000; assert summary['target_crs']=='EPSG:32644'; assert summary['spring_count_ok']>=30 and summary['autumn_count_ok']>=30
          seen_hash={}; seen_item={}
          for season in ('spring','autumn'):
            root=exp/'seasonal_evidence'/season; m=json.loads((root/'manifest.json').read_text()); assert len(m['records'])==37
            for r in m['records']:
              if r.get('status')!='ok': continue
              p=root/'images'/r['files'][0]; h=hashlib.sha256(p.read_bytes()).hexdigest(); key=f"{season}:{r['year']}"; assert h not in seen_hash; seen_hash[h]=key
              item=r.get('item_id'); assert not item or item not in seen_item
              if item: seen_item[item]=key
              with Image.open(p) as im: assert im.width>=1200 and im.height>=1200
          print('EXPERIMENT_015_VALIDATED')
          PY
      - name: Upload Test 015 ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: TEST015_HIMALAYA_TIBET_1990_2026_SPRING_AUTUMN
          path: experiments/experiment_015_himalaya_tibet/
          retention-days: 90
          compression-level: 0
