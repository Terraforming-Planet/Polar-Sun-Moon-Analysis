name: Experiment 013 Cosmopolis-Grays Harbor seasonal evidence

on:
  push:
    branches:
      - experiment-013-cosmopolis-grays-harbor-46-965781--123-510786
    paths:
      - 'tools/build_experiment_013_seasonal_evidence.py'
      - '.github/workflows/experiment-013-seasonal-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-013-cosmopolis-grays-harbor-46-965781--123-510786
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow requests rasterio pyproj
      - name: Build Test 013 spring and autumn imagery 1990-2026
        run: python tools/build_experiment_013_seasonal_evidence.py
      - name: Validate Test 013 dates, frames and duplicate integrity
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import date
          from pathlib import Path
          from PIL import Image
          exp=Path('experiments/experiment_013_cosmopolis_grays_harbor')
          s=json.loads((exp/'BUILD_SUMMARY.json').read_text())
          assert s['experiment']==13 and s['center']=={'lat':46.965781,'lon':-123.510786}
          assert s['frame_width_m']==80000 and s['frame_height_m']==60000 and s['output_grid_m']==30.0
          assert s['spring_count_ok']>=30 and s['autumn_count_ok']>=30, s
          assert Path(s['combined_zip']).exists()
          seen_hash={}; seen_item={}
          for season in ('spring','autumn'):
              root=exp/'seasonal_evidence'/season
              m=json.loads((root/'manifest.json').read_text())
              assert len(m['records'])==37
              for r in m['records']:
                  if r.get('status')!='ok': continue
                  assert str(r['date']).startswith(str(r['year'])+'-')
                  p=root/'images'/r['files'][0]; assert p.exists()
                  h=hashlib.sha256(p.read_bytes()).hexdigest(); key=f"{season}:{r['year']}"
                  assert h not in seen_hash, f"exact duplicate {seen_hash[h]} == {key}"; seen_hash[h]=key
                  item=r.get('item_id')
                  if item: assert item not in seen_item, f"source product reused {seen_item[item]} == {key}"; seen_item[item]=key
                  with Image.open(p) as im: assert im.width>=2000 and im.height>=1500, (key, im.size)
          if date.today()<date(2026,9,1):
              am=json.loads((exp/'seasonal_evidence/autumn/manifest.json').read_text())
              assert next(x for x in am['records'] if x['year']==2026).get('status')!='ok'
          print('EXPERIMENT_013_VALIDATED')
          PY
      - name: Upload Test 013 downloadable ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: TEST013_COSMOPOLIS_GRAYS_HARBOR_1990_2026_SPRING_AUTUMN
          path: |
            experiments/experiment_013_cosmopolis_grays_harbor/*.zip
            experiments/experiment_013_cosmopolis_grays_harbor/seasonal_evidence/spring/*.zip
            experiments/experiment_013_cosmopolis_grays_harbor/seasonal_evidence/autumn/*.zip
            experiments/experiment_013_cosmopolis_grays_harbor/BUILD_SUMMARY.json
            experiments/experiment_013_cosmopolis_grays_harbor/EXPERIMENT_013_REPORT.md
            experiments/experiment_013_cosmopolis_grays_harbor/EVIDENCE_POLICY.json
            experiments/experiment_013_cosmopolis_grays_harbor/seasonal_evidence/spring/manifest.json
            experiments/experiment_013_cosmopolis_grays_harbor/seasonal_evidence/autumn/manifest.json
            experiments/experiment_013_cosmopolis_grays_harbor/seasonal_evidence/spring/CONTACT_SHEET_SPRING_1990_2026.jpg
            experiments/experiment_013_cosmopolis_grays_harbor/seasonal_evidence/autumn/CONTACT_SHEET_AUTUMN_1990_2026.jpg
          retention-days: 90
          compression-level: 0
