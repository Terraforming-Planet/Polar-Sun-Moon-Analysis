name: Codex ForgeMCP Terra Integration

on:
  push:
    branches: ["forgemcp-native-integration"]
    paths:
      - ".github/workflows/forgemcp-native-one-shot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-forgemcp-terra-integration
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: forgemcp-native-integration

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize and mask OpenAI API key
        shell: bash
        env:
          RAW_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ.get("RAW_OPENAI_API_KEY", "")
          clean = raw.replace("\r", "").replace("\n", "").strip(" \t")
          if not clean:
              raise SystemExit("Missing OPENAI_API_KEY repository secret.")
          print(f"::add-mask::{clean}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"OPENAI_API_KEY={clean}\n")
          PY

      - name: Install Codex
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @openai/codex@latest
          codex --version
          printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key
          codex login status

      - name: Execute Codex task
        shell: bash
        run: |
          set -euo pipefail
          PROTECTED_BRIEF='CODEX_FORGEMCP_NATIVE_INTEGRATION.md'
          PROTECTED_WORKFLOW='.github/workflows/forgemcp-native-one-shot.yml'
          env -u OPENAI_API_KEY codex exec --sandbox danger-full-access "$(cat "$PROTECTED_BRIEF")"
          git diff --exit-code -- "$PROTECTED_BRIEF" "$PROTECTED_WORKFLOW"

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build
          cd ..
          if [ -f scripts/ci/scan_tracked_secrets.py ]; then python scripts/ci/scan_tracked_secrets.py; fi

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f CODEX_FORGEMCP_NATIVE_INTEGRATION.md .github/workflows/forgemcp-native-one-shot.yml
          git add -A
          git diff --cached --quiet && { echo 'Codex produced no changes'; exit 1; }
          git commit -m 'feat: complete native ForgeMCP Terra integration'
          git push origin HEAD:forgemcp-native-integration
