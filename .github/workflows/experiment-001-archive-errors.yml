name: Experiment 001 archive suspect imagery

on:
  push:
    branches:
      - annual-best-53-591400-19-010717
    paths:
      - 'tools/archive_experiment_001_errors.py'
      - '.github/workflows/experiment-001-archive-errors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annual-best-53-591400-19-010717
          fetch-depth: 20
          filter: blob:none
          sparse-checkout: |
            tools
            satellite_may_1990_2026
            satellite_alternate_source_may_1990_2025
            experiments
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/archive_experiment_001_errors.py
      - name: Validate archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/experiment_001_pond_forest_kuchnia/errors/do_wyjasnienia')
          d=json.loads((root/'rejected_images_manifest.json').read_text(encoding='utf-8'))
          assert len(d) >= 18, len(d)
          assert any(x.get('year')==2002 and x.get('source')=='source2' for x in d)
          assert any(x.get('year')==2012 and x.get('source')=='source2' for x in d)
          assert any(x.get('year')==2013 and x.get('source')=='source2' for x in d)
          print('ARCHIVE_RECORDS',len(d))
          PY
      - name: Commit archive
        run: |
          git config user.name "Terraforming Planet"
          git config user.email "kontakt@teslaeco.pl"
          git add experiments/experiment_001_pond_forest_kuchnia/errors/do_wyjasnienia
          git diff --cached --quiet && echo "No archive changes" && exit 0
          git commit -m "Archive Experiment 001 suspect imagery for review"
          git pull --rebase origin annual-best-53-591400-19-010717
          git push origin HEAD:annual-best-53-591400-19-010717
