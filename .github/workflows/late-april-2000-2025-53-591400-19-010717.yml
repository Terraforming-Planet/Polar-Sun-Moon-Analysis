name: Late April satellite series 2000-2025

on:
  push:
    branches:
      - annual-best-53-591400-19-010717
    paths:
      - .github/workflows/late-april-2000-2025-53-591400-19-010717.yml
      - tools/build_late_april_2000_2025_53_591400_19_010717.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annual-best-53-591400-19-010717

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pillow pyproj rasterio

      - name: Build 26 late-April real satellite images
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          GDAL_HTTP_MULTIRANGE: 'YES'
          GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: 'YES'
        run: |
          cd tools
          python build_late_april_2000_2025_53_591400_19_010717.py
          cd ..

      - name: Commit generated late-April pack
        run: |
          git config user.name "terraforming-planet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add satellite_late_april/53.591400_19.010717
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Add late-April 2000-2025 satellite pack for 53.591400 19.010717 [skip ci]"
            git push origin HEAD:annual-best-53-591400-19-010717
          fi
