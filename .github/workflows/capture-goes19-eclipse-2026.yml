name: Capture 2026-08-12 eclipse from NOAA GOES-19

on:
  workflow_dispatch:
  schedule:
    # The original 14:45 UTC trigger was merged after its scheduled minute.
    # This one-time backup starts at 15:10 UTC, still before the eclipse reaches
    # the central totality path. The year guard prevents recurrence in later years.
    - cron: '10 15 12 8 *'

permissions:
  contents: write

concurrency:
  group: goes19-eclipse-2026-08-12
  cancel-in-progress: false

jobs:
  capture-goes19:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Enforce 2026 event date for scheduled runs
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          test "$(date -u +%F)" = '2026-08-12'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize observation audit log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eclipse-audit/logs
          {
            echo "workflow_started_utc=$(date -u +%FT%TZ)"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "head_sha=${GITHUB_SHA}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
          } | tee eclipse-audit/session.txt

      - name: Capture official GOES-19 GeoColor sequence
        shell: bash
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          failures=0
          # 36 slots x 10 minutes = six-hour observation window.
          # Each slot writes a durable local log even when NOAA or publishing fails.
          for slot in $(seq 1 36); do
            slot_id=$(printf '%02d' "$slot")
            slot_log="eclipse-audit/logs/slot-${slot_id}.log"
            {
              echo "slot=${slot}/36"
              echo "slot_started_utc=$(date -u +%FT%TZ)"
              echo "main_before=$(git rev-parse HEAD)"
            } | tee "$slot_log"

            set +e
            python scripts/capture_goes19_eclipse.py 2>&1 | tee -a "$slot_log"
            capture_rc=${PIPESTATUS[0]}
            set -e
            echo "capture_exit_code=${capture_rc}" | tee -a "$slot_log"
            if [ "$capture_rc" -ne 0 ]; then
              failures=$((failures + 1))
            fi

            git add web/public/eclipse/2026-08-12/goes19 || true
            if ! git diff --cached --quiet; then
              git commit -m "data(eclipse): capture NOAA GOES-19 frame" 2>&1 | tee -a "$slot_log"

              published=false
              for attempt in 1 2 3 4; do
                echo "publish_attempt=${attempt}" | tee -a "$slot_log"
                if git fetch origin main 2>&1 | tee -a "$slot_log" \
                  && git rebase origin/main 2>&1 | tee -a "$slot_log" \
                  && git push origin HEAD:main 2>&1 | tee -a "$slot_log"; then
                  published=true
                  break
                fi
                git rebase --abort >/dev/null 2>&1 || true
                echo "Push attempt ${attempt} failed or raced with another main update." \
                  | tee -a "$slot_log"
                sleep $((attempt * 5))
              done

              if [ "$published" != true ]; then
                failures=$((failures + 1))
                echo 'Unable to publish this GOES-19 frame after four synchronized attempts.' \
                  | tee -a "$slot_log" >&2
              fi
            else
              echo 'No new NOAA observation in this slot.' | tee -a "$slot_log"
            fi

            if [ -f web/public/eclipse/2026-08-12/goes19/manifest.json ]; then
              cp web/public/eclipse/2026-08-12/goes19/manifest.json \
                "eclipse-audit/manifest-slot-${slot_id}.json"
            fi
            echo "slot_finished_utc=$(date -u +%FT%TZ)" | tee -a "$slot_log"

            if [ "$slot" -lt 36 ]; then
              sleep 600
            fi
          done

          echo "capture_or_publish_failures=${failures}" | tee -a eclipse-audit/session.txt

      - name: Validate observation provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s web/public/eclipse/2026-08-12/goes19/manifest.json
          python - <<'PY' 2>&1 | tee eclipse-audit/provenance-validation.log
          import json
          from pathlib import Path

          path = Path('web/public/eclipse/2026-08-12/goes19/manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['source'] == 'NOAA NESDIS STAR GOES-19 ABI Full Disk GeoColor'
          assert data['satellite_photography'] is True
          assert data['synthetic'] is False
          assert data['frames'], 'No real GOES-19 frames were captured.'
          for frame in data['frames']:
              assert frame['source_url'].startswith(
                  'https://cdn.star.nesdis.noaa.gov/GOES19/ABI/FD/GEOCOLOR/'
              )
              assert len(frame['sha256']) == 64
          print(f"Validated {len(data['frames'])} official GOES-19 frames.")
          PY

      - name: Preserve complete observation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goes19-eclipse-2026-full-record-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            eclipse-audit/
            web/public/eclipse/2026-08-12/goes19/

      - name: Summary
        if: always()
        run: |
          echo '## NOAA GOES-19 eclipse observation' >> "$GITHUB_STEP_SUMMARY"
          echo 'The workflow stores full per-slot logs plus every available NOAA frame and manifest as a GitHub artifact for 90 days.' >> "$GITHUB_STEP_SUMMARY"
          echo 'If the web presentation fails, the raw observation record remains recoverable from the workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Satellite observations remain separate from the NASA predicted-shadow visualization.' >> "$GITHUB_STEP_SUMMARY"
