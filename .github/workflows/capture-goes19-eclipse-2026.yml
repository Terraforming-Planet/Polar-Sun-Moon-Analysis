name: Capture 2026-08-12 eclipse from NOAA GOES-19

on:
  workflow_dispatch:
  schedule:
    # Independent 10-minute capture runs cover the eclipse observation window.
    # GitHub cron is UTC; the year/date guard prevents recurrence in later years.
    - cron: '*/10 14-20 12 8 *'

permissions:
  contents: write

concurrency:
  group: goes19-eclipse-2026-08-12-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  capture-goes19:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enforce 2026 event date for scheduled runs
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          test "$(date -u +%F)" = '2026-08-12'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture one official GOES-19 GeoColor observation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_goes19_eclipse.py

      - name: Publish new observation when available
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/eclipse/2026-08-12/goes19 || true

          if git diff --cached --quiet; then
            echo 'No new NOAA observation in this slot.'
            exit 0
          fi

          git commit -m "data(eclipse): capture NOAA GOES-19 frame"
          published=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              published=true
              break
            fi
            echo "Push attempt ${attempt} raced with another main update; retrying."
            sleep $((attempt * 5))
          done

          if [ "$published" != true ]; then
            echo 'Unable to publish GOES-19 frame after four synchronized attempts.' >&2
            exit 1
          fi

      - name: Validate observation provenance when manifest exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s web/public/eclipse/2026-08-12/goes19/manifest.json ]; then
            echo 'No manifest yet; NOAA may not have published a new frame for this slot.'
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('web/public/eclipse/2026-08-12/goes19/manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['source'] == 'NOAA NESDIS STAR GOES-19 ABI Full Disk GeoColor'
          assert data['satellite_photography'] is True
          assert data['synthetic'] is False
          for frame in data['frames']:
              assert frame['source_url'].startswith(
                  'https://cdn.star.nesdis.noaa.gov/GOES19/ABI/FD/GEOCOLOR/'
              )
              assert len(frame['sha256']) == 64
          print(f"Validated {len(data['frames'])} official GOES-19 frames.")
          PY

      - name: Summary
        run: |
          echo '## NOAA GOES-19 eclipse observation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Attempted one official GOES-19 ABI Full Disk GeoColor observation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'These files are satellite observations, kept separate from the NASA predicted-shadow visualization.' >> "$GITHUB_STEP_SUMMARY"
