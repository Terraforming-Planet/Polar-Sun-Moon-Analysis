name: Apply realistic globe patch

on:
  push:
    branches:
      - feature/automatic-hazard-monitoring

permissions:
  contents: write

concurrency:
  group: realistic-globe-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/automatic-hazard-monitoring

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic frontend patch
        run: python scripts/apply_realistic_globe_patch.py

      - name: Commit patched frontend
        run: |
          if git diff --quiet -- web/src/main.tsx; then
            echo "Frontend already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/main.tsx
          git commit -m "feat: render realistic satellite-textured Earth"
          git push origin HEAD:feature/automatic-hazard-monitoring
