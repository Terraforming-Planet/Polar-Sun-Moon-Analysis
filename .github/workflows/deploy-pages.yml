name: Build and deploy Terra Observation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build Vite application
        run: npm run build
        working-directory: web

      - name: Add Copernicus result pages to the deployment
        run: |
          mkdir -p web/dist/flood-map web/dist/reports web/dist/charts/copernicus web/dist/data/copernicus
          cp -R docs/flood-map/. web/dist/flood-map/
          cp -R docs/reports/. web/dist/reports/
          cp -R docs/charts/copernicus/. web/dist/charts/copernicus/
          cp -R docs/data/copernicus/. web/dist/data/copernicus/

      - name: Verify and harden Pages artifact
        run: |
          test -s web/dist/index.html
          cp web/dist/index.html web/dist/404.html
          touch web/dist/.nojekyll
          echo "Artifact root:"
          ls -la web/dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
