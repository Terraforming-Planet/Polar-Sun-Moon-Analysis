name: Build and deploy Terra Observation

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force GitHub Pages to use Actions workflow
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --data '{"build_type":"workflow"}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh lightweight public observations
        run: |
          python -m terra_hazards sources --output web/public/data/sources.json
          python -m terra_hazards update --output web/public/data/hazards.json --limit 200
          python -m polar_equinox_analysis solar-system --output web/public/data/solar-system.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Test web application
        run: npm test
        working-directory: web

      - name: Build Vite application
        run: npm run build
        working-directory: web

      - name: Add Copernicus result pages to the deployment
        run: |
          mkdir -p web/dist/flood-map web/dist/reports web/dist/charts/copernicus web/dist/data/copernicus
          cp -R docs/flood-map/. web/dist/flood-map/
          cp -R docs/reports/. web/dist/reports/
          cp -R docs/charts/copernicus/. web/dist/charts/copernicus/
          cp -R docs/data/copernicus/. web/dist/data/copernicus/

      - name: Verify and harden Pages artifact
        run: |
          test -s web/dist/index.html
          cp web/dist/index.html web/dist/404.html
          touch web/dist/.nojekyll
          echo "Artifact root:"
          ls -la web/dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
