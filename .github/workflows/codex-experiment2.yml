name: Codex Experiment 2 update

on:
  push:
    branches:
      - codex/experiment-2-himalaya

permissions:
  contents: write

jobs:
  apply-experiment-2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Update Sahara Experiment 2 through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: codex/experiment-2-himalaya
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          api = f'https://api.github.com/repos/{repo}/contents/'

          def request(method, path, payload=None, ref=True):
              url = api + urllib.parse.quote(path, safe='/')
              if method == 'GET' and ref:
                  url += '?ref=' + urllib.parse.quote(branch, safe='')
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode())

          def get_text(path):
              item = request('GET', path)
              text = base64.b64decode(item['content']).decode('utf-8')
              return text, item['sha']

          def put_text(path, text, sha, message):
              request('PUT', path, {
                  'message': message,
                  'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
                  'sha': sha,
                  'branch': branch,
              }, ref=False)

          old_id = 'id="himalaya-water-lesson"'
          new_id = 'id="experiment-2-himalaya"'
          old_eyebrow = 'CIEKAWY PRZYKŁAD Z AZJI / HIPOTEZA DO SYMULACJI'
          new_eyebrow = 'EKSPERYMENT 2 / HIMALAJE / TOPOGRAFIA I WODA'
          old_title = '<h2>Himalaje: jak rzeźba terenu steruje wodą — i czego może nauczyć projekt Sahara</h2>'
          new_title = '<h2>Eksperyment 2 — Himalaje: jak rzeźba terenu steruje wodą — i czego może nauczyć projekt Sahara</h2>'

          for path in ('web/public/sahara-station/index.html', 'docs/sahara-station/index.html'):
              text, sha = get_text(path)
              if new_id in text and new_eyebrow in text and new_title in text:
                  continue
              for old in (old_id, old_eyebrow, old_title):
                  if old not in text:
                      raise SystemExit(f'Expected marker missing in {path}: {old}')
              text = text.replace(old_id, new_id, 1)
              text = text.replace(old_eyebrow, new_eyebrow, 1)
              text = text.replace(old_title, new_title, 1)
              put_text(path, text, sha, 'Add Himalaya water study as Experiment 2')

          test_path = 'tests/test_sahara_station_page.py'
          tests, test_sha = get_text(test_path)
          marker = 'def test_himalaya_article_is_experiment_two() -> None:'
          if marker not in tests:
              tests += '''\n\n\ndef test_himalaya_article_is_experiment_two() -> None:\n    html = PAGE.read_text(encoding="utf-8")\n\n    assert 'id="experiment-2-himalaya"' in html\n    assert "EKSPERYMENT 2 / HIMALAJE / TOPOGRAFIA I WODA" in html\n    assert "Eksperyment 2 — Himalaje: jak rzeźba terenu steruje wodą" in html\n'''
              put_text(test_path, tests, test_sha, 'Test Sahara Experiment 2 article')

          workflow_path = '.github/workflows/codex-experiment2.yml'
          _, workflow_sha = get_text(workflow_path)
          request('DELETE', workflow_path, {
              'message': 'Remove one-time Codex Experiment 2 workflow',
              'sha': workflow_sha,
              'branch': branch,
          }, ref=False)
          PY
