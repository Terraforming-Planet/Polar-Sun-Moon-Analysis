name: Experiment 004 Kacze + Gleboczek shared-frame evidence

on:
  push:
    branches:
      - experiment-004-kacze-gleboczek-53-611719-18-882321
    paths:
      - 'tools/build_experiment_004_seasonal_evidence.py'
      - '.github/workflows/experiment-004-seasonal-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-004-kacze-gleboczek-53-611719-18-882321
          fetch-depth: 20
          filter: blob:none
          sparse-checkout: |
            tools
            experiments
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow requests rasterio pyproj

      - name: Build Test 004 shared-frame imagery 1990-2026
        run: python tools/build_experiment_004_seasonal_evidence.py

      - name: Validate Test 004 package
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import date
          from pathlib import Path

          exp = Path('experiments/experiment_004_kacze_gleboczek_cluster')
          summary = json.loads((exp/'BUILD_SUMMARY.json').read_text(encoding='utf-8'))
          print(summary)
          assert summary['experiment'] == 4
          assert summary['center'] == {'lat': 53.611719, 'lon': 18.882321}
          assert summary['frame_width_m'] == 4000
          assert summary['frame_height_m'] == 4000
          assert summary['objects'] == ['Jezioro Kacze', 'Jezioro Głęboczek']
          assert summary['spring_count_ok'] >= 30, summary
          assert summary['autumn_count_ok'] >= 30, summary

          combined = Path(summary['combined_zip'])
          assert combined.exists() and combined.stat().st_size > 100000

          expected_targets = {
              ('Jezioro Kacze', 53.613918, 18.892053),
              ('Jezioro Głęboczek', 53.609520, 18.872589),
          }

          for season in ('spring', 'autumn'):
              root = exp/'seasonal_evidence'/season
              manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
              assert manifest['center'] == {'lat': 53.611719, 'lon': 18.882321}
              assert manifest['aoi']['width_m'] == 4000
              assert manifest['aoi']['height_m'] == 4000
              assert len(manifest['records']) == 37
              actual_targets = {(x['name'], x['lat'], x['lon']) for x in manifest['targets']}
              assert actual_targets == expected_targets

              seen = {}
              for rec in manifest['records']:
                  if rec.get('status') != 'ok':
                      continue
                  assert str(rec['date']).startswith(str(rec['year']) + '-')
                  assert rec.get('crop_width_m') == 4000
                  assert rec.get('crop_height_m') == 4000
                  native = root/'images'/rec['files'][0]
                  assert native.exists(), native
                  sha = hashlib.sha256(native.read_bytes()).hexdigest()
                  assert sha not in seen, f"duplicate satellite image: {seen.get(sha)} and {rec['year']}"
                  seen[sha] = rec['year']

          if date.today() < date(2026, 9, 1):
              autumn = json.loads((exp/'seasonal_evidence/autumn/manifest.json').read_text(encoding='utf-8'))
              rec2026 = next(r for r in autumn['records'] if r['year'] == 2026)
              assert rec2026.get('status') != 'ok', 'Do not fabricate autumn 2026 before September 2026'

          assert (exp/'EVIDENCE_POLICY.json').exists()
          assert (exp/'EXPERIMENT_004_REPORT.md').exists()
          print('EXPERIMENT_004_KACZE_GLEBOCZEK_VALIDATED')
          PY

      - name: Upload Test 004 downloadable archive
        uses: actions/upload-artifact@v4
        with:
          name: TEST004_KACZE_GLEBOCZEK_1990_2026_SHARED_FRAME
          path: |
            experiments/experiment_004_kacze_gleboczek_cluster/TEST004_KACZE_GLEBOCZEK_1990_2026_SHARED_FRAME_4x4km_53.611719_18.882321.zip
            experiments/experiment_004_kacze_gleboczek_cluster/seasonal_evidence/spring/TEST004_SPRING_1990_2026_37_YEARS_4x4km_53.611719_18.882321.zip
            experiments/experiment_004_kacze_gleboczek_cluster/seasonal_evidence/autumn/TEST004_AUTUMN_1990_2026_37_YEARS_4x4km_53.611719_18.882321.zip
            experiments/experiment_004_kacze_gleboczek_cluster/BUILD_SUMMARY.json
            experiments/experiment_004_kacze_gleboczek_cluster/EXPERIMENT_004_REPORT.md
            experiments/experiment_004_kacze_gleboczek_cluster/EVIDENCE_POLICY.json
          retention-days: 90

      - name: Commit Test 004 evidence outputs
        run: |
          git config user.name "Terraforming Planet"
          git config user.email "kontakt@teslaeco.pl"
          git add experiments/experiment_004_kacze_gleboczek_cluster
          git diff --cached --quiet && echo "No Test 004 evidence changes" && exit 0
          git commit -m "Build Test 004 Kacze Gleboczek satellite dataset 1990-2026"
          git pull --rebase origin experiment-004-kacze-gleboczek-53-611719-18-882321
          git push origin HEAD:experiment-004-kacze-gleboczek-53-611719-18-882321
