name: Fix late April 2015 scene

on:
  push:
    branches:
      - annual-best-53-591400-19-010717
    paths:
      - .github/workflows/fix-late-april-2015-53-591400-19-010717.yml
      - tools/fix_late_april_2015_53_591400_19_010717.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annual-best-53-591400-19-010717

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pillow pyproj rasterio

      - name: Add April 2015 Landsat and rebuild ZIP
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          GDAL_HTTP_MULTIRANGE: 'YES'
          GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: 'YES'
        run: python tools/fix_late_april_2015_53_591400_19_010717.py

      - name: Commit fixed pack
        run: |
          git config user.name "terraforming-planet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add satellite_late_april/53.591400_19.010717
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Complete late-April 2000-2025 pack with 2015 [skip ci]"
            git push origin HEAD:annual-best-53-591400-19-010717
          fi
