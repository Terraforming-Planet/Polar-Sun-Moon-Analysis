name: Analyze water area 1990-2026

on:
  push:
    branches:
      - annual-best-53-591400-19-010717
    paths:
      - tools/analyze_water_area_1990_2026.py
      - .github/workflows/analyze-water-area-1990-2026.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annual-best-53-591400-19-010717
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pillow pyproj rasterio scipy
      - name: Analyze spectral water area
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          GDAL_HTTP_MULTIRANGE: 'YES'
          GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: 'YES'
        run: python tools/analyze_water_area_1990_2026.py
      - name: Commit analysis results
        run: |
          git config user.name "terraforming-planet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add water_analysis_1990_2026/53.591400_19.010717
          if git diff --cached --quiet; then
            echo "No analysis changes"
          else
            git commit -m "Add water area analysis 1990-2026 [skip ci]"
            git pull --rebase origin annual-best-53-591400-19-010717
            git push origin HEAD:annual-best-53-591400-19-010717
          fi
