name: Verify archived 2026 eclipse GOES-19 Band 2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goes19-band02-eclipse-2026-08-12-archive
  cancel-in-progress: false

jobs:
  verify-closed-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify closed event archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path(
              'web/public/eclipse/2026-08-12/goes19-band02/manifest.json'
          )
          archive_path = Path('web/public/eclipse/2026-08-12/archive.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          archive = json.loads(archive_path.read_text(encoding='utf-8'))

          assert manifest['event_date'] == '2026-08-12'
          assert archive['status'] == 'closed-historical-archive'
          assert archive['campaign_date'] == manifest['event_date']
          assert archive['frame_count'] == len(manifest['frames'])
          assert manifest['frames']

          for frame in manifest['frames']:
              assert frame['observed_utc'].startswith('2026-08-12T')
              assert frame['source_url'].startswith(
                  'https://cdn.star.nesdis.noaa.gov/GOES19/ABI/FD/02/'
              )
              assert len(frame['sha256']) == 64

          print(
              f"Closed archive verified: {len(manifest['frames'])} "
              'NOAA GOES-19 Band 2 event-date frames.'
          )
          PY

      - name: Summary
        shell: bash
        run: |
          echo '## 2026 eclipse archive is closed' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow no longer captures or writes new frames.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It only verifies the retained 2026-08-12 NOAA evidence and SHA-256 metadata.' >> "$GITHUB_STEP_SUMMARY"
