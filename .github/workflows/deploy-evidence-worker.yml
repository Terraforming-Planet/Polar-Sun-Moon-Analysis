name: Deploy OpenAI Evidence Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/evidence-worker/**'
      - '.github/workflows/deploy-evidence-worker.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: terra-openai-evidence-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required deployment secrets exist
        id: secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret.'; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo 'Missing OPENAI_API_KEY repository secret.'; exit 1; }
          echo 'Required secret names are configured. Secret values are not printed.'

      - name: Normalize deployment credential whitespace
        id: normalize_credentials
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAW_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          output_path = Path(os.environ['GITHUB_OUTPUT'])
          credentials = (
              ('RAW_CLOUDFLARE_API_TOKEN', 'cloudflare_api_token'),
              ('RAW_CLOUDFLARE_ACCOUNT_ID', 'cloudflare_account_id'),
              ('RAW_OPENAI_API_KEY', 'openai_api_key'),
          )
          normalized: list[tuple[str, str]] = []
          for source_name, output_name in credentials:
              raw = os.environ.get(source_name, '')
              clean = raw.replace('\r', '').replace('\n', '').strip(' \t')
              if not clean:
                  raise SystemExit(f'{source_name} is empty after credential normalization.')
              if raw != clean:
                  print(f'{source_name}: normalized invalid whitespace without printing the value.')
              print(f'::add-mask::{clean}')
              normalized.append((output_name, clean))
          with output_path.open('a', encoding='utf-8') as handle:
              for output_name, clean in normalized:
                  handle.write(f'{output_name}={clean}\n')
          print('Deployment credentials are single-line and normalized. Values remain masked.')
          PY

      - name: Scan tracked files for leaked tokens
        id: secret_scan
        run: python scripts/ci/scan_tracked_secrets.py

      - name: Test Worker guardrails
        id: guardrails
        run: node --test cloudflare/evidence-worker/test/*.test.mjs

      - name: Deploy Worker and bind OpenAI secret
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ steps.normalize_credentials.outputs.cloudflare_api_token }}
          accountId: ${{ steps.normalize_credentials.outputs.cloudflare_account_id }}
          workingDirectory: cloudflare/evidence-worker
          wranglerVersion: '4'
          secrets: |
            OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ steps.normalize_credentials.outputs.openai_api_key }}

      - name: Verify deployed Worker health, TEST 001 and all L4 contexts
        id: health
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$WORKER_URL" || { echo 'Cloudflare action did not return a deployment URL.'; exit 1; }
          [[ "$WORKER_URL" == https://* ]] || { echo 'Worker deployment URL must use HTTPS.'; exit 1; }
          echo "Worker URL: $WORKER_URL"

          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            -H 'Origin: https://terraforming-planet.github.io' \
            "$WORKER_URL/health" > /tmp/health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            -H 'Origin: https://terraforming-planet.github.io' \
            "$WORKER_URL/cases" > /tmp/cases.json

          python - <<'PY'
          import json
          from pathlib import Path

          expected_cases = {
              'test-001-forest-pond-kuchnia',
              'test-011-ilawa-zalewo',
              'test-013-grays-harbor',
              'vistula-test-014',
              'test-015-himalaya-tibet',
          }
          expected_trainings = {'training_1', 'training_2', 'training_3', 'training_4'}

          health = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          assert health.get('service') == 'terra-observation-evidence-explainer'
          assert health.get('openai_configured') is True
          assert expected_cases == set(health.get('supported_case_ids', []))
          assert expected_trainings == set(health.get('training_context_ids', []))

          payload = json.loads(Path('/tmp/cases.json').read_text(encoding='utf-8'))
          registered = {item.get('case_id') for item in payload.get('cases', []) if isinstance(item, dict)}
          trainings = {item.get('training_id') for item in payload.get('training_context', []) if isinstance(item, dict)}
          assert expected_cases == registered
          assert expected_trainings == trainings
          test001 = next(item for item in payload['cases'] if item.get('case_id') == 'test-001-forest-pond-kuchnia')
          assert test001.get('record_count') == 73
          assert len(payload.get('training_context', [])) == 4
          print('Worker health, five-case registry and all four NVIDIA L4 contexts passed; no secret values printed.')
          PY

      - name: Verify real OpenAI TEST 001 explanation
        id: explain
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --retry-all-errors \
            -X POST \
            -H 'Origin: https://terraforming-planet.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"case_id":"test-001-forest-pond-kuchnia"}' \
            "$WORKER_URL/explain" > /tmp/explain.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/explain.json').read_text(encoding='utf-8'))
          assert payload.get('case_id') == 'test-001-forest-pond-kuchnia'
          assert payload.get('evidence_source') == 'canonical-public-repository-artifacts'
          explanation = payload.get('explanation')
          assert isinstance(explanation, dict)
          for field in ('summary', 'why_it_matters', 'uncertainty', 'next_checks'):
              assert isinstance(explanation.get(field), str) and explanation[field].strip()
          print('Live OpenAI TEST 001 explanation passed without printing model output.')
          PY

      - name: Persist public Evidence Worker URL for future Pages builds
        id: persist
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          mkdir -p config
          printf '%s\n' "${WORKER_URL%/}" > config/evidence-worker-url.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/evidence-worker-url.txt
          if git diff --cached --quiet; then
            echo 'Public Worker URL is already persisted.'
            exit 0
          fi
          git commit -m 'chore(config): persist public Evidence Worker URL'
          for attempt in 1 2 3 4; do
            if git fetch origin main \
              && git rebase origin/main \
              && git push origin HEAD:main; then
              echo 'worker_url_persist=success'
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 4))
          done
          echo 'worker_url_persist=failed after 4 attempts'
          exit 1

      - name: Rebuild GitHub Pages with exact source revision
        id: pages_dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          gh workflow run force-pages-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f evidence_api_url="${WORKER_URL%/}" \
            -f expected_source_sha="$GITHUB_SHA"
          echo "Dispatched Pages build for exact required source revision: $GITHUB_SHA"

      - name: Verify exact public Pages AI Research revision
        id: live_pages
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          SITE_URL: https://terraforming-planet.github.io/Polar-Sun-Moon-Analysis/
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          worker_url="${WORKER_URL%/}"
          expected="$EXPECTED_SOURCE_SHA"

          for attempt in $(seq 1 18); do
            nonce="$(date +%s)-$attempt"
            index_url="${SITE_URL}?evidence=${nonce}"
            probe_url="${SITE_URL}deployment-probe.txt?evidence=${nonce}"
            index_status=$(curl --connect-timeout 15 --max-time 30 -L -sS -H 'Cache-Control: no-cache' -o /tmp/site-index.html -w '%{http_code}' "$index_url" || true)
            probe_status=$(curl --connect-timeout 15 --max-time 30 -L -sS -H 'Cache-Control: no-cache' -o /tmp/site-probe.txt -w '%{http_code}' "$probe_url" || true)
            probe_value=$(tr -d '\r\n' < /tmp/site-probe.txt 2>/dev/null || true)

            if [ "$index_status" = '200' ] && [ "$probe_status" = '200' ] && [ "$probe_value" = "$expected" ]; then
              asset_path=$(grep -oE '/Polar-Sun-Moon-Analysis/assets/index-[A-Za-z0-9_-]+\.js' /tmp/site-index.html | head -1 || true)
              if [ -n "$asset_path" ] && curl --connect-timeout 15 --max-time 30 -L -fsS -H 'Cache-Control: no-cache' \
                "https://terraforming-planet.github.io${asset_path}?evidence=${nonce}" > /tmp/site-app.js; then
                if grep -Fq "$worker_url" /tmp/site-app.js \
                  && grep -Fq 'AI Research' /tmp/site-app.js \
                  && grep -Fq 'Cztery opublikowane treningi AI' /tmp/site-app.js \
                  && grep -Fq 'Explain selected test with OpenAI' /tmp/site-app.js; then
                  echo "Public Pages contains exact source revision $expected, TEST registry and four-training AI Research UI."
                  exit 0
                fi
              fi
            fi
            echo "Exact Pages handoff not visible yet (attempt $attempt/18; probe=$probe_value)."
            sleep 20
          done
          echo 'Public Pages did not expose the exact deployed AI Research revision in time.'
          exit 1

      - name: Deployment summary
        id: summary
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo '## Terra OpenAI Evidence Worker'
            echo
            echo "- Worker: ${WORKER_URL%/}"
            echo '- Health + five-case registry + L4 Training #1/#2/#3/#4: passed'
            echo '- Live TEST 001 /explain OpenAI call: passed'
            echo '- OPENAI_API_KEY: stored as Worker secret; value not exposed'
            echo '- Public Worker URL: persisted in config/evidence-worker-url.txt'
            echo "- Exact Pages source revision: $GITHUB_SHA"
            echo '- Public Pages global AI Research bundle: verified'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist safe deployment diagnostics
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
          NORMALIZE_OUTCOME: ${{ steps.normalize_credentials.outcome }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
          GUARDRAILS_OUTCOME: ${{ steps.guardrails.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          EXPLAIN_OUTCOME: ${{ steps.explain.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          PAGES_DISPATCH_OUTCOME: ${{ steps.pages_dispatch.outcome }}
          LIVE_PAGES_OUTCOME: ${{ steps.live_pages.outcome }}
        run: |
          set -euo pipefail
          mkdir -p config
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          worker_url = os.environ.get('WORKER_URL', '').strip().rstrip('/')
          payload = {
              'status': os.environ.get('JOB_STATUS', 'unknown'),
              'run_url': os.environ.get('RUN_URL', ''),
              'source_sha': os.environ.get('SOURCE_SHA', ''),
              'worker_url': worker_url or None,
              'stages': {
                  'required_secrets': os.environ.get('SECRETS_OUTCOME', ''),
                  'credential_normalization': os.environ.get('NORMALIZE_OUTCOME', ''),
                  'tracked_secret_scan': os.environ.get('SECRET_SCAN_OUTCOME', ''),
                  'worker_guardrails': os.environ.get('GUARDRAILS_OUTCOME', ''),
                  'cloudflare_deploy': os.environ.get('DEPLOY_OUTCOME', ''),
                  'health': os.environ.get('HEALTH_OUTCOME', ''),
                  'openai_explain': os.environ.get('EXPLAIN_OUTCOME', ''),
                  'persist_public_url': os.environ.get('PERSIST_OUTCOME', ''),
                  'pages_dispatch': os.environ.get('PAGES_DISPATCH_OUTCOME', ''),
                  'live_pages': os.environ.get('LIVE_PAGES_OUTCOME', ''),
              },
              'contains_secret_values': False,
              'contains_openai_output': False,
          }
          Path('config/evidence-worker-deploy-status.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/evidence-worker-deploy-status.json
          if git diff --cached --quiet; then
            echo 'Deployment diagnostics are unchanged.'
            exit 0
          fi
          git commit -m 'chore(config): record Evidence Worker deploy status'
          for attempt in 1 2 3 4; do
            if git fetch origin main \
              && git rebase origin/main \
              && git push origin HEAD:main; then
              echo 'Safe deployment diagnostics persisted.'
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 4))
          done
          echo 'Could not persist deployment diagnostics; primary job result is unchanged.'
          exit 0
