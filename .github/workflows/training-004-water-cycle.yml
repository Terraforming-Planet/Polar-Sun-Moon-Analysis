name: Training 004 Water Cycle

on:
  pull_request:
    branches: ["main"]
    paths:
      - "config/training-004-water-cycle-30y.json"
      - "terra_research_node/water_cycle_manifest.py"
      - "terra_research_node/water_cycle_acquisition.py"
      - "scripts/build_training_004_water_cycle_manifest.py"
      - "scripts/resolve_training_004_water_cycle_landsat.py"
      - "tests/test_water_cycle_manifest.py"
      - "tests/test_water_cycle_acquisition.py"
      - ".github/workflows/training-004-water-cycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cdse.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-cdse.txt
          python -m pip check

      - name: Ruff
        run: |
          python -m ruff check \
            terra_research_node/water_cycle_manifest.py \
            terra_research_node/water_cycle_acquisition.py \
            scripts/build_training_004_water_cycle_manifest.py \
            scripts/resolve_training_004_water_cycle_landsat.py \
            tests/test_water_cycle_manifest.py \
            tests/test_water_cycle_acquisition.py

      - name: MyPy
        run: |
          python -m mypy \
            terra_research_node/water_cycle_manifest.py \
            terra_research_node/water_cycle_acquisition.py

      - name: Unit tests without network
        run: |
          python -m pytest -q \
            tests/test_water_cycle_manifest.py \
            tests/test_water_cycle_acquisition.py

      - name: Compile modules
        run: |
          python -m compileall \
            terra_research_node/water_cycle_manifest.py \
            terra_research_node/water_cycle_acquisition.py \
            scripts/build_training_004_water_cycle_manifest.py \
            scripts/resolve_training_004_water_cycle_landsat.py
