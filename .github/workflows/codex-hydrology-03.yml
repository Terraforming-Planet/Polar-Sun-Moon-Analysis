name: Codex hydrology iteration 3

on:
  push:
    branches:
      - codex/night-agent-hydrology-features-03

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/night-agent-hydrology-features-03
          fetch-depth: 0
      - name: Apply hydrology wiring
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          section = base64.b64decode('').decode()
          note_add = base64.b64decode('').decode()
          test_add = base64.b64decode('').decode()
          pages = [Path('web/public/sahara-station/index.html'), Path('docs/sahara-station/index.html')]
          anchor = '    <p class="method-note"><strong>Baseline:</strong> histogramy RGB + deterministyczne klastry służą tylko do testu pipeline’u. To nie jest walidowany detektor paleokanałów.</p>'
          for page in pages:
              text = page.read_text(encoding='utf-8')
              if 'id="hydrology-screening-8"' not in text:
                  if anchor not in text:
                      raise SystemExit(f'anchor missing in {page}')
                  text = text.replace(anchor, section + anchor, 1)
              script = '<script type="module" src="./sahara-hydrology.js"></script>'
              globe = '<script type="module" src="./sahara-globe.js"></script>'
              if script not in text:
                  text = text.replace(globe, globe + '\n' + script, 1)
              page.write_text(text, encoding='utf-8')
          for note in [Path('web/public/sahara-station/paleoriver-tests/research-note.md'), Path('docs/sahara-station/paleoriver-tests/research-note.md')]:
              text = note.read_text(encoding='utf-8')
              if '## Iteracja 3 — przesiew topograficzny DEM' not in text:
                  note.write_text(text.rstrip() + note_add + '\n', encoding='utf-8')
          test_file = Path('tests/test_sahara_station_page.py')
          tests = test_file.read_text(encoding='utf-8')
          if 'def test_sahara_station_has_eight_case_dem_hydrology_screening() -> None:' not in tests:
              test_file.write_text(tests.rstrip() + test_add + '\n', encoding='utf-8')
          PY
      - name: Run Sahara tests
        run: python -m pytest tests/test_sahara_station_page.py -q
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/codex-hydrology-03.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/sahara-station docs/sahara-station tests/test_sahara_station_page.py .github/workflows/codex-hydrology-03.yml
          git commit -m "Add DEM hydrology screening for eight paleoriver tests"
          git push origin HEAD:codex/night-agent-hydrology-features-03
