name: Night agent Sahara iteration 1

on:
  push:
    branches:
      - codex/night-agent-sahara-globe-01

permissions:
  contents: write

jobs:
  build-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/night-agent-sahara-globe-01
          fetch-depth: 1

      - name: Install test and image dependencies
        run: python -m pip install --disable-pip-version-check --quiet pillow pytest

      - name: Build Sahara iteration
        run: python scripts/night_agent_iteration1.py

      - name: Run Sahara tests
        run: |
          python -m pytest tests/test_sahara_station_page.py -q
          node --check web/public/sahara-station/sahara-lab.js
          node --check web/public/sahara-station/sahara-globe.js
          cmp web/public/sahara-station/sahara-lab.js docs/sahara-station/sahara-lab.js
          cmp web/public/sahara-station/sahara-globe.js docs/sahara-station/sahara-globe.js
          test "$(find web/public/sahara-station/paleoriver-tests -name '*.jpg' | wc -l)" -eq 8
          test -s web/public/sahara-station/paleoriver-tests/paleoriver_tests_8.zip
          test -s docs/sahara-station/paleoriver-tests/paleoriver_tests_8.zip

      - name: Commit successful iteration
        shell: bash
        run: |
          rm -f .github/workflows/night-agent-iteration1.yml scripts/night_agent_iteration1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: tiled NASA globe, fixed Sahara scaling and 8 water-system tests"
          git push origin HEAD:codex/night-agent-sahara-globe-01
