          from pathlib import Path
          import json, urllib.parse, urllib.request, shutil

          root = Path('.')
          manifest = json.loads((root/'data/training/paleoriver_8/manifest.json').read_text(encoding='utf-8'))
          source_out = root/'web/public/sahara-station/paleoriver-tests'
          docs_out = root/'docs/sahara-station/paleoriver-tests'
