          docs_out.mkdir(parents=True, exist_ok=True)
          endpoint = 'https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi'
          for item in manifest['tests']:
            west, south, east, north = item['bbox']
            params = {
              'SERVICE':'WMS','VERSION':'1.1.1','REQUEST':'GetMap',
              'LAYERS':'MODIS_Terra_CorrectedReflectance_TrueColor','STYLES':'',
              'FORMAT':'image/jpeg','TRANSPARENT':'FALSE','SRS':'EPSG:4326',
              'BBOX':f'{west},{south},{east},{north}','WIDTH':'768','HEIGHT':'768','TIME':item['date'],
            }
            url = endpoint + '?' + urllib.parse.urlencode(params)
            req = urllib.request.Request(url, headers={'User-Agent':'Terraforming-Planet-Research/1.0'})
            with urllib.request.urlopen(req, timeout=90) as response:
              data = response.read()
              content_type = response.headers.get('Content-Type','')
            if len(data) < 10000 or not data.startswith(b'\xff\xd8'):
              raise SystemExit(f'NASA GIBS image failed for {item["id"]}: {content_type}, {len(data)} bytes')
            path = source_out/f'{item["id"]}.jpg'
            path.write_bytes(data)
            shutil.copy2(path, docs_out/path.name)
          PY

      - name: Build baseline training features, notes and ZIP
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import csv, json, math, shutil, zipfile

          root = Path('.')
          manifest = json.loads((root/'data/training/paleoriver_8/manifest.json').read_text(encoding='utf-8'))
          source_out = root/'web/public/sahara-station/paleoriver-tests'
          docs_out = root/'docs/sahara-station/paleoriver-tests'

          rows = []
          vectors = []
          for item in manifest['tests']:
            img = Image.open(source_out/f"{item['id']}.jpg").convert('RGB').resize((96,96))
            hist = img.histogram()
            vec = []
            for channel in range(3):
              channel_hist = hist[channel*256:(channel+1)*256]
              total = sum(channel_hist) or 1
              for start in range(0,256,32):
                vec.append(sum(channel_hist[start:start+32])/total)
            mean = tuple(sum(px[c] for px in img.getdata()) / (96*96) for c in range(3))
            vectors.append(vec)
            rows.append([item['id'], item['continent'], item['kind'], *[round(x,6) for x in mean], *[round(x,7) for x in vec]])

          # Deterministic small k-means baseline. It clusters visual surface signatures only;
          # it is deliberately not labelled as a paleochannel detector.
          k = 4
          centroids = [vectors[i][:] for i in (0,2,4,6)]
          assignments = [0]*len(vectors)
          for _ in range(25):
            new_assignments = []
            for vector in vectors:
              distances = [sum((a-b)**2 for a,b in zip(vector,c)) for c in centroids]
              new_assignments.append(min(range(k), key=lambda idx: distances[idx]))
            if new_assignments == assignments:
              break
            assignments = new_assignments
            for cluster in range(k):
              members = [v for v,a in zip(vectors,assignments) if a == cluster]
              if members:
                centroids[cluster] = [sum(values)/len(values) for values in zip(*members)]

          header = ['id','continent','kind','mean_r','mean_g','mean_b'] + [f'hist_{c}_{b}' for c in 'rgb' for b in range(8)]
          with (source_out/'training_features.csv').open('w', newline='', encoding='utf-8') as handle:
            writer = csv.writer(handle); writer.writerow(header); writer.writerows(rows)
          baseline = {
            'model':'deterministic-kmeans-color-histogram-baseline','k':k,
            'purpose':'pipeline smoke test / visual surface grouping, NOT validated paleochannel detection',
            'assignments':{item['id']:int(a) for item,a in zip(manifest['tests'],assignments)},
            'centroids':centroids,
          }
          (source_out/'baseline_clusters.json').write_text(json.dumps(baseline, indent=2), encoding='utf-8')

          note = '''# Nocna notatka badawcza — iteracja 1\n\n## Obserwacje z danych\n\n- **Death Valley (USA):** zamknięta misa i wachlarze aluwialne pokazują, że geometria zlewni i progi odpływu decydują, czy epizodyczna woda pozostaje w obniżeniu czy szybko odpływa. USGS dokumentuje wielokrotne fazy jeziorne w przeszłości.\n- **Bonneville (USA):** rozległy suchy basen jest użyteczny jako kontrolny przykład dawnego magazynu wody; ten test nie przypisuje każdej widocznej struktury do paleokanału bez dodatkowego DEM i geologii.\n- **Ebro / Aragón (Europa):** aktywna rzeka w półsuchym otoczeniu pokazuje znaczenie naturalnego korytarza rzecznego i sztucznej regulacji/retencji; to analog zarządzania wodą, nie paleorzeka.\n- **Po 2022 (Europa):** odsłonięte łachy i skurczony kanał przy niskim stanie wody pokazują, że magazynowanie w zlewni i zasilanie śnieżne wpływają na ciągłość przepływu.\n- **Tanezrouft (Afryka):** ESA opisuje ślady dawnej erozji wodnej w dziś hiper suchym terenie. To mocny cel do łączenia Sentinel-2 z DEM/SAR.\n- **Tsauchab / Sossusvlei (Afryka):** efemeryczna rzeka kończy się w basenie endoreicznym; naturalna niecka magazynuje wodę/sedyment podczas rzadkich epizodów.\n- **Lop Nur (Azja):** suchy terminalny basen nadaje się do badania dawnych kierunków dopływu, ale interpretacja konkretnych paleokanałów wymaga radaru/DEM i źródeł geologicznych.\n- **Aral (Azja):** współczesny przykład pokazuje, że sama obecność dużego basenu nie gwarantuje retencji, jeżeli dopływy zostaną ograniczone lub przekierowane.\n\n## Wskazówki do symulatora terenu\n\n1. Najpierw wyznaczać **zlewnię, naturalne obniżenia i progi odpływu** z DEM; dopiero potem proponować nowe doliny/zbiorniki.\n2. Liczyć **czas retencji**, infiltrację, parowanie i sedymentację, nie tylko objętość geometryczną.\n3. Preferować **kaskadę mniejszych magazynów** i wykorzystanie istniejących obniżeń przed megastrukturami.\n4. Rozdzielać kanały **aktywne, efemeryczne i kopalne**; satelitarna forma liniowa sama nie dowodzi dawnej rzeki.\n5. Dla terenów pustynnych łączyć optykę Sentinel/Landsat z **SAR i DEM**, bo piasek, sól i skała mogą mieć podobny wygląd w RGB.\n\n## Status treningu\n\nUtworzono 8-obrazowy zestaw kontrolny i baseline K-means na histogramach RGB. Jest to test pipeline’u, nie walidowany model detekcji. Następny krok: ręcznie zweryfikowane maski kanałów + cechy topograficzne i radarowe.\n'''
          (source_out/'research-note.md').write_text(note, encoding='utf-8')
          (source_out/'manifest.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding='utf-8')

          for name in ('training_features.csv','baseline_clusters.json','research-note.md','manifest.json'):
            shutil.copy2(source_out/name, docs_out/name)

          for out in (source_out, docs_out):
            zip_path = out/'paleoriver_tests_8.zip'
            with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
              for jpg in sorted(out.glob('*.jpg')):
                zf.write(jpg, jpg.name)
              for name in ('manifest.json','training_features.csv','baseline_clusters.json','research-note.md'):
                zf.write(out/name, name)
          PY

      - name: Run Sahara station tests
        run: python -m pytest tests/test_sahara_station_page.py -q

      - name: Check generated data and source/docs parity
        shell: bash
        run: |
          test "$(find web/public/sahara-station/paleoriver-tests -name '*.jpg' | wc -l)" -eq 8
          test -s web/public/sahara-station/paleoriver-tests/paleoriver_tests_8.zip
          test -s docs/sahara-station/paleoriver-tests/paleoriver_tests_8.zip
          cmp web/public/sahara-station/sahara-globe.js docs/sahara-station/sahara-globe.js
          grep -q 'findFreePlacement' web/public/sahara-station/sahara-lab.js
          grep -q 'paleoriver-test-suite' docs/sahara-station/index.html

      - name: Commit iteration and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/night-agent-iteration1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Sahara shape controls and add eight satellite water-system tests"
          git push origin HEAD:codex/night-agent-sahara-globe-01
