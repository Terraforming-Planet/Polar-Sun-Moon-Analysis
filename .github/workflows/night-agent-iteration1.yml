name: Night agent Sahara iteration 1

on:
  push:
    branches:
      - codex/night-agent-sahara-globe-01

permissions:
  contents: write

jobs:
  build-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/night-agent-sahara-globe-01
          fetch-depth: 0

      - name: Patch Sahara controls, globe and test gallery
