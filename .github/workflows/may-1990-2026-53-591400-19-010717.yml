name: May satellite series 1990-2026

on:
  push:
    branches:
      - annual-best-53-591400-19-010717
    paths:
      - tools/build_may_1990_2026_53_591400_19_010717.py
      - .github/workflows/may-1990-2026-53-591400-19-010717.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annual-best-53-591400-19-010717

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pillow pyproj rasterio

      - name: Build 37 May real satellite images
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          GDAL_HTTP_MULTIRANGE: 'YES'
          GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: 'YES'
        run: python tools/build_may_1990_2026_53_591400_19_010717.py

      - name: Commit generated May pack
        run: |
          git config user.name "terraforming-planet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add satellite_may_1990_2026/53.591400_19.010717
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Add May 1990-2026 synchronized satellite pack [skip ci]"
            git push origin HEAD:annual-best-53-591400-19-010717
          fi
