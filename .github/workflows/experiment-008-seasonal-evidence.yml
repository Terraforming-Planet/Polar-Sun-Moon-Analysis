name: Experiment 008 Jezioro Stelchno seasonal evidence

on:
  push:
    branches:
      - experiment-008-jezioro-stelchno-53-525217-18-461320
    paths:
      - 'tools/build_experiment_008_seasonal_evidence.py'
      - '.github/workflows/experiment-008-seasonal-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-008-jezioro-stelchno-53-525217-18-461320
          fetch-depth: 20
          filter: blob:none
          sparse-checkout: |
            tools
            experiments
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow requests rasterio pyproj
      - name: Build Test 008 Jezioro Stelchno imagery 1990-2026
        run: python tools/build_experiment_008_seasonal_evidence.py
      - name: Validate Test 008 package
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import date
          from pathlib import Path
          exp=Path('experiments/experiment_008_jezioro_stelchno')
          s=json.loads((exp/'BUILD_SUMMARY.json').read_text())
          assert s['experiment']==8
          assert s['object']=='Jezioro Stelchno'
          assert s['center']=={'lat':53.525217,'lon':18.46132}
          assert s['frame_width_m']==7000 and s['frame_height_m']==9000
          assert s['spring_count_ok']>=30 and s['autumn_count_ok']>=30
          assert Path(s['combined_zip']).exists()
          for season in ('spring','autumn'):
              root=exp/'seasonal_evidence'/season
              manifest=json.loads((root/'manifest.json').read_text())
              assert len(manifest['records'])==37
              seen={}
              for r in manifest['records']:
                  if r.get('status')!='ok': continue
                  p=root/'images'/r['files'][0]
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  assert h not in seen, (season, seen.get(h), r['year'])
                  seen[h]=r['year']
          if date.today()<date(2026,9,1):
              manifest=json.loads((exp/'seasonal_evidence/autumn/manifest.json').read_text())
              r=next(x for x in manifest['records'] if x['year']==2026)
              assert r.get('status')!='ok'
          print('EXPERIMENT_008_STELCHNO_VALIDATED')
          PY
      - name: Upload Test 008 archive
        uses: actions/upload-artifact@v4
        with:
          name: TEST008_JEZIORO_STELCHNO_1990_2026
          path: |
            experiments/experiment_008_jezioro_stelchno/TEST008_JEZIORO_STELCHNO_1990_2026_FULL_VIEW_7x9km_53.525217_18.461320.zip
            experiments/experiment_008_jezioro_stelchno/seasonal_evidence/spring/TEST008_SPRING_1990_2026_37_YEARS_7x9km_53.525217_18.461320.zip
            experiments/experiment_008_jezioro_stelchno/seasonal_evidence/autumn/TEST008_AUTUMN_1990_2026_37_YEARS_7x9km_53.525217_18.461320.zip
            experiments/experiment_008_jezioro_stelchno/BUILD_SUMMARY.json
            experiments/experiment_008_jezioro_stelchno/EXPERIMENT_008_REPORT.md
            experiments/experiment_008_jezioro_stelchno/EVIDENCE_POLICY.json
          retention-days: 90
      - name: Commit Test 008 evidence outputs
        run: |
          git config user.name "Terraforming Planet"
          git config user.email "kontakt@teslaeco.pl"
          git add experiments/experiment_008_jezioro_stelchno
          git diff --cached --quiet && echo "No Test 008 evidence changes" && exit 0
          git commit -m "Build Test 008 Jezioro Stelchno satellite dataset 1990-2026"
          git pull --rebase origin experiment-008-jezioro-stelchno-53-525217-18-461320
          git push origin HEAD:experiment-008-jezioro-stelchno-53-525217-18-461320
