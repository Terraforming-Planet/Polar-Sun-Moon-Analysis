name: Global Safety Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: global-safety-monitor
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build global safety feed and 3D hazard layer
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/build_global_safety_feed.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          events = json.loads(Path("web/public/data/events/latest.json").read_text(encoding="utf-8"))
          hazards = json.loads(Path("web/public/data/hazards.json").read_text(encoding="utf-8"))
          assert isinstance(events.get("events"), list)
          assert isinstance(hazards.get("features"), list)
          assert events.get("event_count", 0) > 0
          assert hazards.get("feature_count", 0) > 0
          print("Events:", events["event_count"])
          print("3D markers:", hazards["feature_count"])
          PY

      - name: Commit public data
        run: |
          git config user.name "terraforming-planet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data/events/latest.json web/public/data/hazards.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): update global safety feed and 3D markers"
            git push
          fi

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
