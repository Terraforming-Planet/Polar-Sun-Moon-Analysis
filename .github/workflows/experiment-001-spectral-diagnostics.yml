name: Experiment 001 spectral diagnostics

on:
  push:
    branches:
      - annual-best-53-591400-19-010717
    paths:
      - 'tools/diagnose_experiment_001_spectral_values.py'
      - '.github/workflows/experiment-001-spectral-diagnostics.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annual-best-53-591400-19-010717
          fetch-depth: 5
          sparse-checkout: |
            tools
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pillow requests rasterio pyproj scipy
      - run: python tools/diagnose_experiment_001_spectral_values.py
