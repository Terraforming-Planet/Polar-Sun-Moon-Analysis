name: Force deploy Polar Sun Moon Analysis to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/**'
      - '.github/workflows/force-pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

env:
  SITE_URL: https://terraforming-planet.github.io/Polar-Sun-Moon-Analysis/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Test application
        working-directory: web
        run: npm test

      - name: Build application for project Pages URL
        working-directory: web
        env:
          VITE_BASE_PATH: /Polar-Sun-Moon-Analysis/
        run: npm run build

      - name: Verify deployment artifact
        run: |
          set -euo pipefail
          test -s web/dist/index.html
          test -d web/dist/assets
          grep -q '/Polar-Sun-Moon-Analysis/' web/dist/index.html
          cp web/dist/index.html web/dist/404.html
          touch web/dist/.nojekyll
          find web/dist -maxdepth 2 -type f | sort | head -100

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish deployment URL
        run: |
          echo '## GitHub Pages deployment' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Action output: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected project URL: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - name: Wait for GitHub Pages propagation
        run: sleep 20

      - name: E2E smoke test deployed website
        shell: bash
        run: |
          set -euo pipefail
          page_url='${{ needs.deploy.outputs.page_url }}'
          if [ -z "$page_url" ]; then
            page_url="$SITE_URL"
          fi
          echo "Testing $page_url"
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$page_url" || true)
            if [ "$status" = '200' ] && grep -qi '<!doctype html' /tmp/page.html; then
              echo "E2E passed: $page_url returned HTTP 200"
              echo '## E2E deployment check' >> "$GITHUB_STEP_SUMMARY"
              echo '' >> "$GITHUB_STEP_SUMMARY"
              echo "✅ Live site: $page_url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt failed with HTTP $status; retrying..."
            sleep 15
          done
          echo "Deployment did not become available at $page_url"
          cat /tmp/page.html || true
          exit 1
