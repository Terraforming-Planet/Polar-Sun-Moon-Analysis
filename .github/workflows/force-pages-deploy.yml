name: Build web app into docs for GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '!web/public/data/**'
      - 'published/**'
      - 'config/evidence-worker-url.txt'
      - '.github/workflows/force-pages-deploy.yml'
  workflow_dispatch:
    inputs:
      evidence_api_url:
        description: 'Public Cloudflare Evidence Worker URL for this Pages build.'
        required: false
        type: string
      expected_source_sha:
        description: 'Source revision that this Pages publication must contain.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: github-pages-docs-production
  cancel-in-progress: false

env:
  SITE_URL: https://terraforming-planet.github.io/Polar-Sun-Moon-Analysis/

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run unit tests
        working-directory: web
        run: npm test

      - name: Resolve production inputs
        id: production-inputs
        shell: bash
        env:
          DISPATCH_URL: ${{ inputs.evidence_api_url }}
          REPOSITORY_URL: ${{ vars.VITE_EVIDENCE_API_URL }}
          REQUESTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          persisted_url=''
          if [ -s config/evidence-worker-url.txt ]; then
            persisted_url=$(tr -d '\r\n' < config/evidence-worker-url.txt)
          fi
          worker_url="${DISPATCH_URL:-${persisted_url:-$REPOSITORY_URL}}"
          worker_url="${worker_url%/}"
          test -n "$worker_url" || {
            echo 'No public Evidence Worker URL is configured. Refusing to publish a DISCONNECTED production bundle.'
            exit 1
          }
          [[ "$worker_url" == https://* ]] || { echo 'VITE_EVIDENCE_API_URL must use HTTPS.'; exit 1; }

          expected_source_sha="${REQUESTED_SOURCE_SHA:-$GITHUB_SHA}"
          git cat-file -e "${expected_source_sha}^{commit}" 2>/dev/null || {
            echo "Expected source revision is not available in checkout: $expected_source_sha"
            exit 1
          }
          git merge-base --is-ancestor "$expected_source_sha" HEAD || {
            echo "Checkout does not contain requested source revision: $expected_source_sha"
            exit 1
          }

          echo "url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "expected_source_sha=$expected_source_sha" >> "$GITHUB_OUTPUT"
          echo "Pages build contains requested source revision: $expected_source_sha"

      - name: Build Vite application
        working-directory: web
        env:
          VITE_EVIDENCE_API_URL: ${{ steps.production-inputs.outputs.url }}
        run: npm run build

      - name: Verify privacy-first Simple research production bundle
        shell: bash
        env:
          EVIDENCE_URL: ${{ steps.production-inputs.outputs.url }}
        run: |
          set -euo pipefail
          test -s web/dist/index.html
          test -d web/dist/assets
          grep -q '/Polar-Sun-Moon-Analysis/' web/dist/index.html
          grep -R -Fq "$EVIDENCE_URL" web/dist/assets
          grep -R -Fq 'Research any place on Earth' web/dist/assets
          grep -R -Fq 'Wpisz miejsce. Resztę przygotuje system.' web/dist/assets
          grep -R -Fq 'MINIMUM 4 PRAWDZIWE WIDOKI' web/dist/assets
          grep -R -Fq 'Wyślij prywatnie' web/dist/assets
          grep -R -Fq 'ODPOWIEDŹ NA PYTANIE' web/dist/assets
          grep -R -Fq 'MAPA POMOCNICZA · PAŃSTWA + RZEKI' web/dist/assets
          grep -R -Fq 'KONCEPCJA / WIZJA PROJEKTU' web/dist/assets
          grep -R -Fq 'Tests 1–16' web/dist/assets
          grep -R -Fq 'Training 1' web/dist/assets
          grep -R -Fq 'Research archive' web/dist/assets
          grep -R -Fq 'Approved AI tests' web/dist/assets
          grep -R -Fq 'terra-research-manifest/v1' web/dist/assets
          grep -R -Fq 'Explain selected test with OpenAI' web/dist/assets
          if grep -Fq 'result-nav' web/dist/index.html || grep -Fq 'station-strip' web/dist/index.html; then
            echo 'Legacy pre-React navigation/station strip leaked back into the production entry page.'
            exit 1
          fi
          if grep -R -Fq 'Research account · Sign in with ChatGPT' web/dist/assets; then
            echo 'Unsupported ChatGPT sign-in control leaked into the production research chat.'
            exit 1
          fi
          if grep -R -Fq 'Continue with ChatGPT — not configured' web/dist/assets; then
            echo 'Disabled ChatGPT sign-in placeholder leaked into the production research chat.'
            exit 1
          fi
          test -s web/dist/research-archive/index.json
          echo 'Production bundle contains the privacy-first Simple flow, four real NASA context views, compact test/training navigation, river helper and guarded OpenAI workspace.'

      - name: Publish build into docs
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.production-inputs.outputs.expected_source_sha }}
        run: |
          set -euo pipefail
          mkdir -p docs
          rm -rf docs/assets docs/published
          cp -R web/dist/. docs/
          if [ -d published ]; then
            mkdir -p docs/published
            cp -R published/. docs/published/
            find docs/published -type f \( -iname '*.tif' -o -iname '*.tiff' -o -iname '*.zip' \) -delete
          fi
          cp docs/index.html docs/404.html
          touch docs/.nojekyll
          printf '%s\n' "$EXPECTED_SOURCE_SHA" > docs/deployment-probe.txt
          test -s docs/index.html
          test -d docs/assets
          test -s docs/deployment-probe.txt
          test -s docs/research-archive/index.json

      - name: Commit generated Pages files with rebase retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi

          git commit -m "chore(pages): publish web build for ${GITHUB_SHA::7}"
          for attempt in 1 2 3 4; do
            echo "pages_publish_attempt=${attempt}"
            if git fetch origin main \
              && git rebase origin/main \
              && git push origin HEAD:main; then
              echo 'pages_publish=success'
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 4))
          done
          echo 'pages_publish=failed after 4 attempts'
          exit 1

  e2e:
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact branch-based Pages revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$EXPECTED_SOURCE_SHA"
          echo "Expected source revision: $expected"

          for attempt in $(seq 1 12); do
            nonce="$(date +%s)-$attempt"
            index_url="${SITE_URL}?deploy=${nonce}"
            probe_url="${SITE_URL}deployment-probe.txt?deploy=${nonce}"
            index_status=$(curl --connect-timeout 15 --max-time 30 -L -sS -H 'Cache-Control: no-cache' -o /tmp/index.html -w '%{http_code}' "$index_url" || true)
            probe_status=$(curl --connect-timeout 15 --max-time 30 -L -sS -H 'Cache-Control: no-cache' -o /tmp/probe.txt -w '%{http_code}' "$probe_url" || true)
            probe_value=$(tr -d '\r\n' < /tmp/probe.txt 2>/dev/null || true)
            echo "Attempt $attempt: index=$index_status probe=$probe_status value=$probe_value"

            if [ "$index_status" = '200' ] && [ "$probe_status" = '200' ] && [ "$probe_value" = "$expected" ]; then
              grep -qi '<!doctype html' /tmp/index.html
              echo '## GitHub Pages E2E' >> "$GITHUB_STEP_SUMMARY"
              echo '' >> "$GITHUB_STEP_SUMMARY"
              echo "✅ Live site: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
              echo "✅ Published requested source revision: $expected" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done

          echo 'Branch-based Pages deployment did not publish the exact requested revision.'
          exit 1
