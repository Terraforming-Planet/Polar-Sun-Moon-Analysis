name: Force deploy Polar Sun Moon Analysis to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Test application
        working-directory: web
        run: npm test

      - name: Build application for project Pages URL
        working-directory: web
        env:
          VITE_BASE_PATH: /Polar-Sun-Moon-Analysis/
        run: npm run build

      - name: Verify deployment artifact
        run: |
          test -s web/dist/index.html
          grep -q '/Polar-Sun-Moon-Analysis/' web/dist/index.html
          cp web/dist/index.html web/dist/404.html
          touch web/dist/.nojekyll
          find web/dist -maxdepth 2 -type f | sort | head -100

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
