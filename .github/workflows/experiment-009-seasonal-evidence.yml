name: Experiment 009 Jezioro Plowez seasonal evidence

on:
  push:
    branches:
      - experiment-009-jezioro-plowez-53-452516-19-212111
    paths:
      - 'tools/build_experiment_009_seasonal_evidence.py'
      - '.github/workflows/experiment-009-seasonal-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-009-jezioro-plowez-53-452516-19-212111
          fetch-depth: 20
          filter: blob:none
          sparse-checkout: |
            tools
            experiments
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow requests rasterio pyproj
      - name: Build Test 009 Jezioro Plowez imagery 1990-2026
        run: python tools/build_experiment_009_seasonal_evidence.py
      - name: Validate Test 009 package
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import date
          from pathlib import Path
          exp=Path('experiments/experiment_009_jezioro_plowez')
          s=json.loads((exp/'BUILD_SUMMARY.json').read_text())
          assert s['experiment']==9
          assert s['center']=={'lat':53.452516,'lon':19.212111}
          assert s['frame_width_m']==7000 and s['frame_height_m']==9000
          assert s['spring_count_ok']>=30 and s['autumn_count_ok']>=30
          assert Path(s['combined_zip']).exists()
          for season in ('spring','autumn'):
              root=exp/'seasonal_evidence'/season
              manifest=json.loads((root/'manifest.json').read_text())
              assert len(manifest['records'])==37
              seen={}
              for r in manifest['records']:
                  if r.get('status')!='ok': continue
                  p=root/'images'/r['files'][0]
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  assert h not in seen, (season, seen.get(h), r['year'])
                  seen[h]=r['year']
          if date.today()<date(2026,9,1):
              manifest=json.loads((exp/'seasonal_evidence/autumn/manifest.json').read_text())
              r=next(x for x in manifest['records'] if x['year']==2026)
              assert r.get('status')!='ok'
          print('EXPERIMENT_009_PLOWEZ_VALIDATED')
          PY
      - name: Upload Test 009 archive
        uses: actions/upload-artifact@v4
        with:
          name: TEST009_JEZIORO_PLOWEZ_1990_2026
          path: |
            experiments/experiment_009_jezioro_plowez/TEST009_JEZIORO_PLOWEZ_1990_2026_FULL_VIEW_7x9km_53.452516_19.212111.zip
            experiments/experiment_009_jezioro_plowez/seasonal_evidence/spring/TEST009_SPRING_1990_2026_37_YEARS_7x9km_53.452516_19.212111.zip
            experiments/experiment_009_jezioro_plowez/seasonal_evidence/autumn/TEST009_AUTUMN_1990_2026_37_YEARS_7x9km_53.452516_19.212111.zip
            experiments/experiment_009_jezioro_plowez/BUILD_SUMMARY.json
            experiments/experiment_009_jezioro_plowez/EXPERIMENT_009_REPORT.md
            experiments/experiment_009_jezioro_plowez/EVIDENCE_POLICY.json
          retention-days: 90
      - name: Prepare repository-safe Test 009 outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          exp=Path('experiments/experiment_009_jezioro_plowez')
          limit=95*1024*1024
          deleted=[]
          for p in exp.rglob('*.zip'):
              if p.stat().st_size>limit:
                  deleted.append(str(p))
                  p.unlink()
          if deleted:
              path=exp/'BUILD_SUMMARY.json'
              s=json.loads(path.read_text())
              s['archive_delivery']='github_actions_artifact_for_large_archives'
              s['repository_omitted_large_archives']=deleted
              s['archive_run_url']='https://github.com/Terraforming-Planet/Polar-Sun-Moon-Analysis/actions'
              path.write_text(json.dumps(s,indent=2,ensure_ascii=False))
          print({'deleted_large_archives':deleted})
          PY
      - name: Commit Test 009 evidence outputs
        run: |
          git config user.name "Terraforming Planet"
          git config user.email "kontakt@teslaeco.pl"
          git add experiments/experiment_009_jezioro_plowez
          git diff --cached --quiet && echo "No Test 009 evidence changes" && exit 0
          git commit -m "Build Test 009 Jezioro Plowez satellite dataset 1990-2026"
          git pull --rebase origin experiment-009-jezioro-plowez-53-452516-19-212111
          git push origin HEAD:experiment-009-jezioro-plowez-53-452516-19-212111
