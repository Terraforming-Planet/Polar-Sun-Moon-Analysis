name: Probe third source Sentinel-1

on:
  push:
    branches:
      - annual-best-53-591400-19-010717
    paths:
      - '.github/workflows/probe-third-source-sentinel1.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: python -m pip install requests pystac-client planetary-computer rasterio pyproj numpy
      - name: Probe Sentinel-1 RTC and GRD
        shell: bash
        run: |
          python - <<'PY'
          import planetary_computer
          import pystac_client
          import rasterio
          from rasterio.vrt import WarpedVRT
          from pyproj import Transformer
          lat=53.591400; lon=19.010717
          bbox=[lon-0.03,lat-0.03,lon+0.03,lat+0.03]
          catalog=pystac_client.Client.open('https://planetarycomputer.microsoft.com/api/stac/v1', modifier=planetary_computer.sign_inplace)
          try:
              rtc=list(catalog.search(collections=['sentinel-1-rtc'],bbox=bbox,datetime='2021-05-01/2021-05-31',max_items=1).items())
              print('RTC_COUNT',len(rtc))
              if rtc:
                  it=rtc[0]; print('RTC_ITEM',it.id,'ASSETS',sorted(it.assets))
                  for key in ['vv','vh']:
                      if key in it.assets:
                          try:
                              with rasterio.open(it.assets[key].href) as src:
                                  print('RTC_RASTER_OK',key,src.width,src.height,str(src.crs),src.dtypes,src.nodata,src.transform)
                          except Exception as exc:
                              print('RTC_RASTER_FAIL',key,repr(exc))
          except Exception as exc:
              print('RTC_SEARCH_FAIL',repr(exc))
          grd=list(catalog.search(collections=['sentinel-1-grd'],bbox=bbox,datetime='2021-05-01/2021-05-31',max_items=1).items())
          print('GRD_COUNT',len(grd))
          if grd:
              it=grd[0]; print('GRD_ITEM',it.id)
              with rasterio.open(it.assets['vv'].href) as src:
                  gcps,gcp_crs=src.gcps
                  print('GRD_GCPS',len(gcps),str(gcp_crs),src.width,src.height)
                  try:
                      with WarpedVRT(src,crs='EPSG:32634',resampling=rasterio.enums.Resampling.bilinear) as vrt:
                          x,y=Transformer.from_crs('EPSG:4326','EPSG:32634',always_xy=True).transform(lon,lat)
                          win=vrt.window(x-1000,y-1000,x+1000,y+1000).round_offsets().round_lengths()
                          arr=vrt.read(1,window=win,boundless=True)
                          print('GRD_WARP_OK',arr.shape,float(arr.min()),float(arr.max()),float(arr.mean()))
                  except Exception as exc:
                      print('GRD_WARP_FAIL',repr(exc))
          PY
