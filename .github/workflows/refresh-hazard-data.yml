name: Refresh hazard data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-hazard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/automatic-hazard-monitoring

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Refresh official public feeds
        run: python scripts/refresh_public_hazard_feeds.py

      - name: Validate generated JSON
        run: |
          python -m json.tool web/public/data/hazards.json >/dev/null
          python -m json.tool web/public/data/earthquakes.geojson >/dev/null
          python -m json.tool web/public/data/eonet-events.json >/dev/null

      - name: Commit changed data
        run: |
          if git diff --quiet -- web/public/data; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/hazards.json \
            web/public/data/earthquakes.geojson \
            web/public/data/eonet-events.json
          git commit -m "data: refresh official hazard feeds"
          git push origin HEAD:feature/automatic-hazard-monitoring
