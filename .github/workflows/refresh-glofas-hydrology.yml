name: Refresh GloFAS hydrology metadata

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glofas-hydrology-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh official EWDS catalogue metadata
        run: python scripts/refresh_glofas_catalog.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('web/public/data/hydrology/glofas-catalog.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          ids = {item.get('id') for item in payload.get('sources', [])}
          required = {'cems-glofas-forecast', 'cems-glofas-historical'}
          assert required <= ids, (required, ids)
          assert payload.get('generated_at_utc')
          print('Validated GloFAS sources:', sorted(ids))
          PY

      - name: Commit refreshed metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/data/hydrology/glofas-catalog.json
          if git diff --cached --quiet; then
            echo 'No hydrology metadata changes.'
          else
            git commit -m 'data: refresh official GloFAS hydrology metadata'
            git push origin HEAD:main
          fi
