name: Final high-resolution 2km retry

on:
  push:
    branches:
      - satellite-history-53-594070-19-000151
    paths:
      - .github/workflows/satellite-history-53-594070-19-000151.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: satellite-history-53-594070-19-000151
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install requests numpy pillow pyproj rasterio pystac-client planetary-computer
      - name: Retry Landsat PAN15 and JAXA ALOS anonymous access
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          GDAL_HTTP_MULTIRANGE: 'YES'
          GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: 'YES'
        run: |
          export PYTHONPATH="$PWD/tools:$PYTHONPATH"
          python tools/retry_highres_2km.py
      - name: Commit final packs
        run: |
          git config user.name "terraforming-planet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add satellite_packs/53.594070_19.000151
          if ! git diff --cached --quiet; then
            git commit -m "Improve real 2km satellite comparison packs [skip ci]"
            git push origin HEAD:satellite-history-53-594070-19-000151
          fi
