name: Multi-satellite 2km packs 53.594070 19.000151

on:
  push:
    branches:
      - satellite-history-53-594070-19-000151
    paths:
      - .github/workflows/satellite-history-53-594070-19-000151.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: satellite-history-53-594070-19-000151

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pillow pyproj rasterio pystac-client planetary-computer

      - name: Build base real satellite packs
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          GDAL_HTTP_MULTIRANGE: 'YES'
          GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: 'YES'
          AWS_NO_SIGN_REQUEST: 'YES'
        run: python tools/build_satellite_packs_2km.py

      - name: Add Landsat L2 JAXA PALSAR and CBERS official packs
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          GDAL_HTTP_MULTIRANGE: 'YES'
          GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: 'YES'
        run: python tools/fix_add_satellite_packs_2km.py

      - name: Add USGS Level-1 PAN15 and retry ALOS mosaics
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          GDAL_HTTP_MULTIRANGE: 'YES'
          GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: 'YES'
        run: python tools/build_highres_landsat_alos_2km.py

      - name: Commit generated packs
        run: |
          git config user.name "terraforming-planet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add satellite_packs/53.594070_19.000151
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Add real 2km multi-satellite comparison packs [skip ci]"
            git push origin HEAD:satellite-history-53-594070-19-000151
          fi
