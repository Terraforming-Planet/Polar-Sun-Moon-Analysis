name: Annual best satellite images 53.591400 19.010717

on:
  push:
    branches:
      - annual-best-53-591400-19-010717
    paths:
      - .github/workflows/annual-best-53-591400-19-010717.yml
      - tools/finalize_annual_highres_53_591400_19_010717.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annual-best-53-591400-19-010717

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pillow pyproj

      - name: Build GLS epoch references and complete 27-year pack
        run: python tools/finalize_annual_highres_53_591400_19_010717.py

      - name: Commit final packs
        run: |
          git config user.name "terraforming-planet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add satellite_annual_best_highres/53.591400_19.010717
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Finalize 27-year real satellite comparison pack [skip ci]"
            git push origin HEAD:annual-best-53-591400-19-010717
          fi
