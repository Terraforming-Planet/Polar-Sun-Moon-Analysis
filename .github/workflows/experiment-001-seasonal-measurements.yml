name: Experiment 001 seasonal measurements

on:
  push:
    branches:
      - annual-best-53-591400-19-010717
    paths:
      - 'tools/measure_experiment_001_seasonal_water.py'
      - '.github/workflows/experiment-001-seasonal-measurements.yml'
      - 'experiments/experiment_001_pond_forest_kuchnia/seasonal_evidence/spring/manifest.json'
      - 'experiments/experiment_001_pond_forest_kuchnia/seasonal_evidence/autumn/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annual-best-53-591400-19-010717
          fetch-depth: 20
          filter: blob:none
          sparse-checkout: |
            tools
            experiments
          sparse-checkout-cone-mode: true

      - name: Check seasonal manifests exist
        id: ready
        run: |
          if [ -f experiments/experiment_001_pond_forest_kuchnia/seasonal_evidence/spring/manifest.json ] && [ -f experiments/experiment_001_pond_forest_kuchnia/seasonal_evidence/autumn/manifest.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Seasonal imagery is still being built; measurement will run automatically when manifests are committed."
          fi

      - uses: actions/setup-python@v5
        if: steps.ready.outputs.ready == 'true'
        with:
          python-version: '3.11'

      - name: Install spectral-analysis dependencies
        if: steps.ready.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow requests rasterio pyproj scipy

      - name: Apply token endpoint correction and measure
        if: steps.ready.outputs.ready == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/measure_experiment_001_seasonal_water.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("PC_TOKEN=PC_STAC.replace('/stac/v1','')+'/api/sas/v1/token/{collection}'", "PC_TOKEN='https://planetarycomputer.microsoft.com/api/sas/v1/token/{collection}'")
          p.write_text(s,encoding='utf-8')
          PY
          python tools/measure_experiment_001_seasonal_water.py

      - name: Validate endpoint outputs
        if: steps.ready.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/experiment_001_pond_forest_kuchnia/measurements')
          data=json.loads((root/'seasonal_water_measurements.json').read_text(encoding='utf-8'))
          assert len(data['records']) >= 40, len(data['records'])
          ep=json.loads((root/'endpoint_1990_vs_2026.json').read_text(encoding='utf-8'))
          print('ENDPOINTS',ep)
          assert any(x['object']=='forest_pond' for x in ep)
          assert any(x['object']=='lake_kuchnia' for x in ep)
          print('MEASUREMENT_RECORDS',len(data['records']),'FAILURES',len(data['failures']))
          PY

      - name: Commit measurements
        if: steps.ready.outputs.ready == 'true'
        run: |
          git checkout -- tools/measure_experiment_001_seasonal_water.py
          git config user.name "Terraforming Planet"
          git config user.email "kontakt@teslaeco.pl"
          git add experiments/experiment_001_pond_forest_kuchnia/measurements
          git diff --cached --quiet && echo "No measurement changes" && exit 0
          git commit -m "Measure Experiment 001 spring-autumn water area on common 30m grid"
          git pull --rebase origin annual-best-53-591400-19-010717
          git push origin HEAD:annual-best-53-591400-19-010717
