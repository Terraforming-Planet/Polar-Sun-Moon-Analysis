[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The safety-feed collector currently contains compact generated ingestion blocks.
# Keep correctness/import/bug checks active, while formatting is handled in a
# dedicated collector-refactor PR instead of blocking the progress/roadmap PR.
"scripts/build_global_safety_feed.py" = ["E"]
# The global public-data transport modules intentionally keep long official-source
# notes and compact manifest/error tuples close to the network code. These scoped
# exceptions do not disable bug checks elsewhere in the repository.
"terra_research_node/global_public_dataset.py" = ["E501", "F401", "UP035"]
"terra_research_node/global_public_training.py" = ["E501"]
"terra_research_node/historical_public_seed.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true
